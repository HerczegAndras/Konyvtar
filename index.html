<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Könyvtár Kezelő - Windows 98 Edition</title>
    <style>
        /* Win98 3D stílusok */
        body {
            background-color: #008080; /* Klasszikus Windows teal háttér */
            font-family: "MS Sans Serif", Arial, sans-serif;
        }
        .win98-window {
            background-color: #c0c0c0;
            border-top: 2px solid #ffffff;
            border-left: 2px solid #ffffff;
            border-right: 2px solid #808080;
            border-bottom: 2px solid #808080;
            box-shadow: 2px 2px 0px #000000;
        }
        .win98-titlebar {
            background: linear-gradient(90deg, #000080, #1084d0);
            color: white;
            font-weight: bold;
            padding: 4px 8px;
        }
        .win98-button {
            background-color: #c0c0c0;
            border-top: 2px solid #ffffff;
            border-left: 2px solid #ffffff;
            border-right: 2px solid #808080;
            border-bottom: 2px solid #808080;
            box-shadow: inset 1px 1px 0px #dfdfdf, inset -1px -1px 0px #808080;
            padding: 4px 12px;
            font-weight: bold;
            cursor: pointer;
        }
        .win98-button:active {
            border-top: 2px solid #808080;
            border-left: 2px solid #808080;
            border-right: 2px solid #ffffff;
            border-bottom: 2px solid #ffffff;
            box-shadow: none;
            padding: 5px 11px 3px 13px;
        }
        .win98-input, .win98-select {
            background-color: #ffffff;
            border-top: 2px solid #808080;
            border-left: 2px solid #808080;
            border-right: 2px solid #ffffff;
            border-bottom: 2px solid #ffffff;
            padding: 4px;
            outline: none;
        }
    </style>
</head>
<body class="min-h-screen p-4 sm:p-6 lg:p-8">
    <div class="max-w-5xl mx-auto space-y-6">
        
        <!-- Főablak: Új könyv hozzáadása -->
        <div class="win98-window rounded-none p-1">
            <div class="win98-titlebar flex justify-between items-center text-sm">
                <span>📁 Új könyv hozzáadása.exe</span>
                <span class="bg-[#c0c0c0] text-black px-2 border-t border-l border-white border-r border-b border-black text-xs cursor-pointer font-bold">X</span>
            </div>
            <div class="p-4 sm:p-6 space-y-4">
                <form class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="flex flex-col gap-1">
                        <label for="címInput" class="text-xs font-bold text-black">Cím:</label>
                        <input type="text" name="cím" id="címInput" placeholder="Egri csillagok" class="win98-input text-sm text-black">
                    </div>

                    <div class="flex flex-col gap-1">
                        <label for="szerzőInput" class="text-xs font-bold text-black">Szerző:</label>
                        <input type="text" name="szerző" id="szerzőInput" placeholder="Gárdonyi Géza" class="win98-input text-sm text-black">
                    </div>

                    <div class="flex flex-col gap-1">
                        <label for="kiadásÉveInput" class="text-xs font-bold text-black">Kiadás éve:</label>
                        <input type="text" name="kiadásÉve" id="kiadásÉveInput" placeholder="1950" maxlength="4" class="win98-input text-sm text-black">
                    </div>

                    <div class="flex flex-col gap-1">
                        <label for="oldalszámInput" class="text-xs font-bold text-black">Oldalszám:</label>
                        <input type="text" name="oldalszám" id="oldalszámInput" placeholder="300" class="win98-input text-sm text-black">
                    </div>
                    
                    <div class="flex flex-col gap-1 sm:col-span-2">
                        <label for="kategóriaInput" class="text-xs font-bold text-black">Kategória:</label>
                        <input type="text" name="kategória" id="kategóriaInput" placeholder="Fantasy" class="win98-input text-sm text-black">
                    </div>

                    <div class="sm:col-span-2 pt-2">
                        <button onclick="hozzáad()" id="hozzaad" type="button" class="win98-button text-xs text-black">
                            [ Hozzáadás ]
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Második ablak: Statisztikák és Szűrés -->
        <div class="win98-window rounded-none p-1">
            <div class="win98-titlebar flex justify-between items-center text-sm">
                <span>📊 Statisztikák és Kereső.exe</span>
                <span class="bg-[#c0c0c0] text-black px-2 border-t border-l border-white border-r border-b border-black text-xs cursor-pointer font-bold">X</span>
            </div>
            <div class="p-4 sm:p-6 space-y-4">
                
                <div class="flex flex-wrap gap-2">
                    <button id="Legregebbi" onclick="legregebbiKönyv(könyvek)" type="button" class="win98-button text-xs text-black">🏛️ Legrégebbi</button>
                    <button id="Legvastagabb" onclick="legvastagabbKönyv(könyvek)" type="button" class="win98-button text-xs text-black">📖 Legvastagabb</button>
                    <button id="Szabad" onclick="SzabadKönyvek(könyvek)" type="button" class="win98-button text-xs text-black">✅ Szabad</button>
                    <button id="atlagOldalszam" onclick="atlagOldalszam(könyvek)" type="button" class="win98-button text-xs text-black">📊 Átlag oldal</button>
                    <button id="KolcsonozhetoKonyvek" onclick="kolcsonozhetoKonyvek(könyvek)" type="button" class="win98-button text-xs text-black">📚 Kölcsönözhető</button>
                </div>

                <!-- Kategória szűrő rész -->
                <div class="space-y-1 pt-2 border-t border-gray-400">
                    <label for="Kategoriavalasztas" class="text-xs font-bold text-black block">Válassz kategóriát:</label>
                    <select id="Kategoriavalasztas" onchange="KategoriaSzures()" class="win98-select w-full sm:w-72 text-sm text-black">
                    </select>

                    <div id="KönyvekSzürve" class="mt-3 space-y-1"></div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                    <p id="LegregebbiKonyv" class="p-3 bg-white border-t border-l border-gray-600 border-r border-b border-white text-black empty:hidden"></p>
                    <p id="LegvastagabbKonyv" class="p-3 bg-white border-t border-l border-gray-600 border-r border-b border-white text-black empty:hidden"></p>
                    <p id="SzabadKonyvek" class="p-3 bg-white border-t border-l border-gray-600 border-r border-b border-white text-black empty:hidden"></p>
                    <p id="KonyvAllapot" class="p-3 bg-white border-t border-l border-gray-600 border-r border-b border-white text-black empty:hidden"></p>
                    <p id="AtlagOldalszam" class="p-3 bg-white border-t border-l border-gray-600 border-r border-b border-white text-black empty:hidden sm:col-span-2"></p>
                    <p id="KolcsonozhetoKonyv" class="p-3 bg-white border-t border-l border-gray-600 border-r border-b border-white text-black empty:hidden sm:col-span-2"></p>
                </div>
                
                <p id="KonyvekKiras" class="text-xs font-bold text-black"></p>
            </div>
        </div>

        <!-- Harmadik ablak: Könyvlista Táblázat -->
        <div class="win98-window rounded-none p-1">
            <div class="win98-titlebar flex justify-between items-center text-sm">
                <span>📋 Adatbázis - Könyvlista.dat</span>
                <span class="bg-[#c0c0c0] text-black px-2 border-t border-l border-white border-r border-b border-black text-xs cursor-pointer font-bold">X</span>
            </div>
            <div class="p-4 overflow-x-auto bg-white border-t border-l border-gray-600 border-r border-b border-white m-2">
                <table id="KonyvekTabla" class="w-full text-left border-collapse text-xs">
                    <thead>
                        <tr class="bg-[#c0c0c0] text-black border-b-2 border-gray-600">
                            <th class="p-2 border-r border-gray-400">Cím</th>
                            <th class="p-2 border-r border-gray-400">Szerző</th>
                            <th class="p-2 border-r border-gray-400">Kategória</th>  
                            <th class="p-2 border-r border-gray-400">Oldalszám</th>
                            <th class="p-2 border-r border-gray-400">Kiadás éve</th>
                            <th class="p-2 border-r border-gray-400">Állapot</th>
                            <th class="p-2">Művelet</th>
                        </tr>
                    </thead>
                    <tbody id="KonyvekTablaBody" class="divide-y divide-gray-200 text-black">
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script src="java.js"></script>
</body>
</html>
